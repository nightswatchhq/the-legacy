[workspace]
members = ["crates/legacy-format", "crates/shadow", "crates/solo"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
# The toolchain this was actually built and tested on, and therefore the only one it can honestly
# claim. Lowering it needs a green `cargo test` + `cargo clippy` on the lower toolchain, not a guess.
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nightswatchhq/the-legacy"
authors = ["Petko Pavlovski"]

[workspace.dependencies]
legacy-format = { path = "crates/legacy-format", version = "0.0.1" }
blake3 = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
